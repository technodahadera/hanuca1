:root{--ink:#17304b;--navy:#1a2d74;--dark:#111f59;--blue:#2f6fda;--cyan:#52b5ff;--teal:#38b7b4;--warm:#f6c54f;--gold:#ffdb70;--violet:#7d68c7;--pink:#f15d9f;--paper:#f7faff;--white:#fff;--line:#d9e5f3;--muted:#5a6f85;--light:#ecf4ff;--good:#1f8a63;--bad:#b65555;--radius:19px;--shadow:0 12px 34px rgba(28,53,112,.10)}

/* Compact scientific icon system — no large decorative illustration panels. */
.icon-svg{display:block;width:1em;height:1em;flex:none;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stage-title{display:flex;align-items:center;gap:11px;margin-bottom:14px;min-width:0}
.stage-title h2{margin:0;min-width:0}
.stage-icon,.supply-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;background:#eef4ff;border:1px solid #dde8f6;color:#355fc1;border-radius:12px}
.stage-icon{width:41px;height:41px;font-size:23px}
.supply-icon{width:32px;height:32px;font-size:19px;border-radius:10px}
.supply-grid{list-style:none;padding:0;margin:8px 0 17px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.supply-item{display:flex;align-items:center;gap:9px;min-width:0;min-height:53px;padding:9px 11px;border:1px solid #e1eaf4;border-radius:12px;background:#fbfcff;font-size:14px;line-height:1.5}
.supply-item span:last-child{min-width:0}
.materials-title{display:flex;align-items:center;gap:9px;margin:18px 0 8px;font-size:1.07rem;font-weight:700;color:#233e69}
.materials-title .icon-svg{width:19px;height:19px;color:#315eb9}
.material-note{font-size:12px;color:var(--muted);margin-top:5px}
.station-index{background:#eef4ff;color:#2855b6}
.station-index .icon-svg{width:27px;height:27px}
.task-card-accent{border-inline-start:3px solid #e4bb63}
.step-list li{padding-inline-start:3px}
.station-card{align-items:center}
@media(max-width:680px){.supply-grid{grid-template-columns:1fr}.supply-item{min-height:45px;padding:8px 10px;font-size:13.5px}.supply-icon{width:30px;height:30px;font-size:18px}.stage-title{gap:9px}.stage-icon{width:35px;height:35px;font-size:21px}.station-index{width:44px;height:44px;flex-basis:44px}}


.stage-icon.station-1,.station-card:nth-child(1) .station-index{color:#a57317;background:#fff7de;border-color:#f0dfa8}
.stage-icon.station-2,.station-card:nth-child(2) .station-index{color:#286ac8;background:#eaf4ff;border-color:#cfe4ff}
.stage-icon.station-3,.station-card:nth-child(3) .station-index{color:#7856b8;background:#f3edff;border-color:#e6d9fb}
.stage-icon.station-4,.station-card:nth-child(4) .station-index{color:#218a83;background:#eaf8f5;border-color:#cbece4}
.bonus-return-panel{margin-top:20px;border-color:#d6def4;background:linear-gradient(160deg,#ffffff,#f7faff)}.bonus-return-heading{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}.bonus-return-heading h2{font-size:clamp(1.1rem,3vw,1.35rem);margin:0 0 5px}.bonus-return-heading p{font-size:.9rem;margin:0}.bonus-return-symbol{width:42px;height:42px;display:grid;place-items:center;background:#fff2ca;color:#a5760d;border-radius:13px;flex-shrink:0}.bonus-return-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bonus-return-button{background:white;border:1px solid #d7e2f3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:13px;color:var(--ink);text-align:right;min-height:61px;line-height:1.35;transition:border-color .15s,background .15s}.bonus-return-button:hover,.bonus-return-button:focus-visible{background:#f5f9ff;border-color:#72a7e8}.bonus-return-name{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.89rem}.bonus-return-name svg{color:var(--blue);flex-shrink:0}.bonus-return-points{white-space:nowrap;color:#7b5d16;font-size:.76rem;font-weight:700;background:#fff6d9;border-radius:99px;padding:5px 8px}.station-bonus-hint{display:block;margin-top:9px;font-size:.76rem;color:#2d6ab0;font-weight:700}.saved-progress-notice{margin-bottom:14px;font-size:.93rem;border-color:#d6e4fa}@media(max-width:700px){.bonus-return-list{grid-template-columns:1fr}.bonus-return-button{min-height:60px}.bonus-return-points{font-size:.74rem}}

.oil-instructions-layout>.step-list{margin:0}
.oil-guide{margin:0;max-width:360px;width:100%;justify-self:center;border:1px solid #dbe7f4;border-radius:16px;overflow:hidden;background:#f8fbff;box-shadow:0 5px 15px rgba(28,53,112,.06)}
.oil-guide img{display:block;width:100%;height:auto;aspect-ratio:16 / 9;object-fit:contain;background:#f8fbff}
.oil-guide figcaption{font-size:12px;line-height:1.4;padding:8px 12px;color:#536b88;background:#f5f8ff;text-align:center}
@media(max-width:700px){.oil-instructions-layout{grid-template-columns:1fr;gap:14px}.oil-guide{max-width:350px}.oil-guide figcaption{font-size:11px}}

const blankStation=()=>({step:0,notes:{},measure:{smooth:[],rough:[],fabric:[]},required:{},bonuses:{},watched:false,bonusIndex:0,completedExperiment:false});
const defaultState=()=>({version:1,team:'',screen:'welcome',station:1,stations:{1:blankStation(),2:blankStation(),3:blankStation(),4:blankStation()},video:null,videoTimes:{}});
let state=loadState();
// Always begin a new page visit at the welcome screen, while preserving every saved answer and point.
state.screen='welcome';
state.video=null;
let choiceIndex=null;
let quizFeedback=null;
let bonusView='intro';
let timer={running:false,started:0,elapsed:0,animation:null};
let simReversed=false;
let toastTimeout=null;
const root=document.getElementById('app');

function loadState(){try{let raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultState();let obj=JSON.parse(raw);if(obj.version!==1||!obj.stations)return defaultState();const next=defaultState();Object.assign(next,obj);for(let i=1;i<=4;i++)next.stations[i]={...blankStation(),...obj.stations[i],notes:{...(obj.stations[i]?.notes||{})},measure:{smooth:[],rough:[],fabric:[],...(obj.stations[i]?.measure||{})},required:{...(obj.stations[i]?.required||{})},bonuses:{...(obj.stations[i]?.bonuses||{})}};if(next.screen==='video')next.screen='map';return next;}catch(e){return defaultState();}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){/* Private browsing may disable localStorage. */}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function S(n=state.station){return state.stations[n];}
function requiredDone(n){return QA[n].required.every(q=>!!S(n).required[q.id]);}
function allRequired(){return [1,2,3,4].every(requiredDone);}
function questionPoints(n){return QA[n].required.reduce((a,q)=>a+(S(n).required[q.id]?q.points:0),0)+QA[n].bonus.reduce((a,q)=>a+(S(n).bonuses[q.id]?q.points:0),0);}
function totalScore(){return [1,2,3,4].reduce((sum,n)=>sum+questionPoints(n),0);}
function litLights(){return [1,2,3,4].reduce((sum,n)=>sum+(requiredDone(n)?2:0),0);}
function completedStations(){return [1,2,3,4].filter(requiredDone).length;}
function toast(msg){const el=document.getElementById('toast');clearTimeout(toastTimeout);el.textContent=msg;el.classList.add('show');toastTimeout=setTimeout(()=>el.classList.remove('show'),3800);}
function fmtSeconds(seconds){return Number(seconds).toFixed(2).replace('.',',');}
function bonusEarned(n){return QA[n].bonus.reduce((sum,q)=>sum+(S(n).bonuses[q.id]?q.points:0),0);}
function pendingBonuses(){return [1,2,3,4].filter(n=>requiredDone(n)&&bonusEarned(n)<5);}
function bonusReturnPanel(){const pending=pendingBonuses();if(!pending.length)return '';return `<section class="card bonus-return-panel" aria-labelledby="bonus-return-title"><div class="bonus-return-heading"><span class="bonus-return-symbol">${iconSvg('target',24)}</span><div><h2 id="bonus-return-title">רוצים להוסיף נקודות בונוס?</h2><p class="muted">אפשר לחזור לשאלות הבונוס גם אחרי שסיימתם תחנה. כל התשובות והנקודות שכבר צברתם נשמרות.</p></div></div><div class="bonus-return-list">${pending.map(n=>`<button type="button" class="bonus-return-button" data-action="return-bonus" data-station="${n}"><span class="bonus-return-name">${iconSvg([null,'flask','bulb','spin','sun'][n],19)}<span>תחנה ${n}: ${escapeHtml(TITLES[n].name)}</span></span><span class="bonus-return-points">עוד ${5-bonusEarned(n)} נק׳ אפשריות</span><span aria-hidden="true">←</span></button>`).join('')}</div></section>`;}
function hasPriorProgress(){return [1,2,3,4].some(n=>S(n).step>0||S(n).completedExperiment||requiredDone(n)||Object.keys(S(n).bonuses).length>0)||totalScore()>0;}
function scoreBadge(n){return `<span class="pill ${requiredDone(n)?'done':''}">${requiredDone(n)?'✓ התחנה הושלמה':'◷ בתהליך'} · ${questionPoints(n)}/25</span>`;}
function lightsMarkup(mini=false,previewUnlit=false){let active=previewUnlit?0:litLights();if(mini)return `<span class="lights-mini" aria-label="${active} מתוך 8 אורות דולקים">${Array.from({length:8},(_,i)=>`<i class="${i<active?'on':''}"></i>`).join('')}</span>`;return `<div class="lights" role="img" aria-label="${active} מתוך שמונה אורות דולקים">${Array.from({length:8},(_,i)=>`<div class="lamp ${i<active?'on':''}"><div class="lamp-bulb"></div><div class="lamp-stem"></div><div class="lamp-number">${i+1}</div></div>`).join('')}</div><div class="lamp-rail"></div>`;}
function header(){const h=document.getElementById('header-hud');h.innerHTML=state.screen==='welcome'?`<span class="small-hide" style="color:#eef4ff;font-size:12px">מבצע שמונת האורות · חג החקר של טכנודע</span>`:`${lightsMarkup(true)}<div class="header-score"><strong>${totalScore()}</strong><small>/100</small></div>`;document.getElementById('map-button').style.display=state.screen==='welcome'?'none':'';}
function show(markup){root.innerHTML=markup;header();root.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function badge(txt,cl=''){return `<span class="pill ${cl}">${escapeHtml(txt)}</span>`;}
function buttons(primary='ממשיכים',back=true,disable=false){return `<div class="btn-row">${back?`<button type="button" class="btn btn-ghost" data-action="prev">לשלב הקודם</button>`:''}<button type="button" class="btn btn-primary" data-action="next" ${disable?'disabled':''}>${primary}<span aria-hidden="true">←</span></button><button type="button" class="btn btn-text" data-action="map">מפת התחנות</button></div>`;}
function stepProgress(n){let cur=S(n).step,tot=STEPS[n].length;return `<div class="progress-meta"><span>שלב ${cur+1} מתוך ${tot}</span><span>${escapeHtml(TITLES[n].sub)}</span></div><div class="stepbar" aria-label="התקדמות בשלבי התחנה">${Array.from({length:tot},(_,i)=>`<i class="${i<cur?'done':i===cur?'active':''}"></i>`).join('')}</div>`;}
function safety(text){return `<div class="safety"><span aria-hidden="true">ⓘ</span><div><strong>שומרים על בטיחות:</strong> ${escapeHtml(text)}</div></div>`;}
function mediaButton(key,label){return `<div class="media-card"><div class="media-label"><span class="media-icon" aria-hidden="true">▷</span><div><strong>${escapeHtml(label)}</strong><div class="mini-muted">צפייה לפי בחירה · בתוך הפלטפורמה</div></div></div><button class="btn btn-ghost" data-action="open-video" data-video="${key}">צופים בסרטון</button></div>`;}

function iconSvg(key,size=20){const path=ICON_PATHS[key]||ICON_PATHS.flask;return `<svg class="icon-svg" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;}
function supplyIconKey(label){if(/ארלמנאייר|ארלנמאייר/.test(label))return 'flask';if(/צבע/.test(label))return 'palette';if(/סבון/.test(label))return 'bubbles';if(/פיפט/.test(label))return 'pipette';if(/משטפת|מים/.test(label))return 'bottle';if(/מגש/.test(label))return 'tray';if(/סולל/.test(label))return 'battery';if(/LED|נורת/.test(label))return 'bulb';if(/חוט/.test(label))return 'cable';if(/סביבון/.test(label))return 'spin';if(/נייר לטש/.test(label))return 'layers';if(/בד/.test(label))return 'fabric';if(/קאפה|משטח/.test(label))return 'square';if(/פנס/.test(label))return 'flashlight';if(/מסך|בריסטול/.test(label))return 'screen';if(/פלסטלינה/.test(label))return 'shapes';if(/טאבלט|מחשב/.test(label))return 'tablet';return 'list';}

function surveyOptions(step,selected){return `<div class="choice-grid" role="group" aria-label="${escapeHtml(step.prompt)}">${step.options.map((o,i)=>`<button type="button" class="choice ${String(selected)===String(i)?'selected':''}" data-action="choice" data-index="${i}" aria-pressed="${String(selected)===String(i)}"><span class="choice-letter">${'אבגד'[i]||i+1}</span>${escapeHtml(o)}</button>`).join('')}</div>`;}
function measurementDiagram(){return `<div class="measure-graphic" aria-label="שלושה משטחי ניסוי"><div><div class="shape">◈</div><strong>קאפה חלקה</strong><div class="plate"></div></div><div><div class="shape">◈</div><strong>נייר לטש</strong><div class="plate rough"></div></div><div><div class="shape">◈</div><strong>בד</strong><div class="plate fabric"></div></div></div>`;}
function circuitDiagram(){return `<div class="diagram"><strong>הדמיית כיווניות LED</strong><div class="circuit-line"><div class="component">סוללה<br><small>+ &nbsp;&nbsp;&nbsp;&nbsp; −</small></div><i class="circuit-wire"></i><div class="component ${simReversed?'off':'on'}">${simReversed?'○ LED כבויה':'✺ LED דולקת'}<small>${simReversed?'כיוון הפוך':'כיוון מתאים'}</small></div></div><button class="btn btn-ghost" data-action="toggle-sim">הופכים את כיוון הנורה בהדמיה</button><div class="mini-muted">ההדמיה בלבד. אין לחבר רכיבי חשמל אמיתיים לפי התרשים הזה.</div></div>`;}
function shadowDiagram(){return `<div class="surface" style="text-align:center;margin:15px 0"><div style="display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:16px"><span>פנס</span><span style="font-weight:800;color:#b38d3e">⇢ ⇢ ⇢</span><span>דמות מפלסטלינה</span><span style="font-weight:800;color:#b38d3e">⇢ ⇢ ⇢</span><span>מסך לבן</span></div><div class="small-muted">הדמות נמצאת בין מקור האור למסך. אין להאיר לעיניים.</div></div>`;}
function toWelcome(){const hasSavedProgress=hasPriorProgress();show(`<section class="home-hero"><div><div class="kicker">נבחרתם למשימת חקר</div><h1>מבצע<br>שמונת האורות</h1><p class="lead-muted">בחג האורות הזה מעבדת טכנודע מוארת בידע, בחקר ובסקרנות. בכל תחנה תדליקו עוד שני אורות בעזרת ניסוי, תצפית וחשיבה מדעית.</p><div class="small-actions"><span class="pill">4 תחנות חקר</span><span class="pill">עד 100 נקודות</span><span class="pill">כיתות ד׳–ו׳</span></div><div class="btn-row"><button class="btn btn-gold" data-action="begin-new">מתחילים משימה חדשה ←</button>${hasSavedProgress?`<button class="btn btn-ghost" data-action="resume">ממשיכים משחק קודם</button>`:''}<button class="btn btn-ghost" data-action="open-video" data-video="opening">סרטון הפתיחה</button></div></div><div class="hero-side"><div class="light-panel">${lightsMarkup(false,true)}<div class="hero-caption">בכל תחנה מדליקים עוד שני אורות</div></div></div></section><section class="card" style="margin-top:18px">${hasSavedProgress?`<div class="surface saved-progress-notice"><strong>זיהינו משחק קודם שנשמר במכשיר.</strong> במשחק הקודם נצברו ${totalScore()} נקודות ונדלקו ${litLights()} אורות. בחרו ״ממשיכים משחק קודם״ כדי לשמור עליו, או ״מתחילים משימה חדשה״ כדי להתחיל מ־0.</div>`:''}<div class="kicker">לפני שמתחילים</div><h2>שם צוות החוקרים</h2><p class="muted">בחרו שם צוות קצר. משימה חדשה מתחילה עם 0 נרות ו־0 נקודות. אין צורך בשמות אישיים; התקדמות תישמר במכשיר.</p><label class="label" for="team-input">שם הצוות</label><input id="team-input" maxlength="26" class="text-field" autocomplete="off" placeholder="למשל: חוקרי הגלקסיה" value="${escapeHtml(state.team)}"><div class="small-actions"><span class="pill">הוראות בעברית</span><span class="pill">ניסוי אמיתי + הדרכה דיגיטלית</span><span class="pill">קצב אישי</span></div></section>`);}
function toMap(){let complete=completedStations();let first=allRequired();show(`<div class="kicker">מרכז הבקרה של החוקרים</div><div class="station-head"><div><h1>מפת התחנות</h1><p class="lead-muted">${escapeHtml(state.team||'צוות החוקרים')}, בחרו את התחנה שבה אתם נמצאים. אפשר להתקדם בכל סדר.</p></div>${badge(`${complete}/4 תחנות הושלמו`,complete===4?'done':'')}</div><div class="card" style="margin-bottom:18px"><div class="progress-meta"><span>התקדמות: ${complete} מתוך 4 תחנות</span><span>${litLights()}/8 אורות · ${totalScore()}/100 נקודות</span></div><div class="progressbar"><span style="width:${complete*25}%"></span></div><div class="small-actions"><button class="btn btn-ghost" data-action="open-video" data-video="opening">צפייה חוזרת בסרטון הפתיחה</button>${first?`<button class="btn btn-primary" data-action="finish">סיכום המשימה</button>`:''}</div></div><div class="section-heading"><h2>בחרו תחנת חקר</h2><span class="small-muted">הניקוד וההתקדמות נשמרים אוטומטית</span></div><div class="station-grid">${[1,2,3,4].map(n=>`<button class="station-card" data-action="start-station" data-station="${n}"><span class="station-index">${iconSvg([null,'flask','bulb','spin','sun'][n],26)}</span><span class="station-copy"><strong>${escapeHtml(TITLES[n].name)}</strong><p>${escapeHtml(TITLES[n].sub)}</p><span class="station-tag">נרות ${TITLES[n].lights}</span><span style="display:block;margin-top:10px">${scoreBadge(n)}</span>${requiredDone(n)&&bonusEarned(n)<5?`<span class="station-bonus-hint">אפשר לחזור לבונוס ולהוסיף נקודות ←</span>`:''}</span></button>`).join('')}</div>${bonusReturnPanel()}${first?`<div class="completion" style="margin-top:21px"><h3>כל שמונת האורות דולקים!</h3><p>אפשר לחזור לתחנות ולהשלים שאלות בונוס כדי לשפר את הציון, או לעבור לסיכום.</p><button class="btn btn-primary" data-action="finish">לסיכום המשימה</button></div>`:''}<p class="small-muted" style="margin-top:20px">זהו משחק לימודי מקומי בדפדפן. הוא אינו שולח מידע אישי לשרת.</p>`);}
function initStep(n){const p=S(n);const step=STEPS[n][p.step];return `<div class="station-head"><div><div class="kicker">תחנה ${n} · נרות ${TITLES[n].lights}</div><h1>${escapeHtml(TITLES[n].name)}</h1></div>${scoreBadge(n)}</div>${stepProgress(n)}<div class="card step-card"><div class="eyebrow">מעבדת חקר · ${escapeHtml(TITLES[n].colors)}</div><div class="stage-title"><span class="stage-icon station-${n}">${iconSvg(stepIconKey(n,step))}</span><h2>${escapeHtml(step.title)}</h2></div>`;}
function renderStation(){const n=state.station,p=S(n),step=STEPS[n][p.step];if(!step){state.screen='quiz';save();return render()};let html=initStep(n);if(step.kind==='intro'){html+=`<p class="lead-muted">${escapeHtml(step.desc)}</p>${supplies(n)}${step.video?mediaButton(step.video,step.videoLabel):''}${safety(step.safety)}<div class="surface"><strong>עקרון המשימה:</strong> משערים ← מבצעים ניסוי ← מתעדים ← מסיקים מסקנה. המערכת מציגה את ההוראות; המדריך משגיח על הבטיחות בלבד.</div>${buttons('נכנסים לניסוי',p.step>0)}`;}
else if(step.kind==='choice'){let selected=p.notes[step.key];html+=`<p class="prompt">${escapeHtml(step.prompt)}</p>${step.diagram?circuitDiagram():''}${surveyOptions(step,selected)}${step.hint?`<div class="surface"><strong>רמז:</strong> ${escapeHtml(step.hint)}</div>`:''}${step.note?`<p class="small-muted">${escapeHtml(step.note)}</p>`:''}${step.safety?safety(step.safety):''}${buttons('ממשיכים לבדיקה',true,selected===undefined)}`;}
else if(step.kind==='instruction'){html+=`${step.text?`<p class="prompt">${escapeHtml(step.text)}</p>`:''}${step.diagram?circuitDiagram():''}${step.shadow?shadowDiagram():''}${n===1&&step.title==='בודקים שמן ומים'?`<div class="oil-instructions-layout"><ol class="step-list">${step.items.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol><figure class="oil-guide"><img src="${OIL_MIXING_GUIDE}" alt="הדגמה מונפשת של שלבי בדיקת השמן והמים: מזיגה, סגירה וניעור, המתנה ותצפית" width="480" height="270" loading="lazy" decoding="async"><figcaption>המחשה מונפשת · פועלים לפי ההוראות הכתובות</figcaption></figure></div>`:`<ol class="step-list">${step.items.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol>`}${step.dynamic==='oilAdditional'?`<div class="surface" style="margin-top:16px"><strong>הבחירה שלכם:</strong> ${escapeHtml(['עוצרים אחרי פיפטה אחת ומשווים','מוסיפים עוד פיפטה אחת, מנערים וממתינים','מוסיפים עוד שתי פיפטות, מנערים וממתינים'][Number(p.notes.oilMore||0)])}</div>`:''}${step.safety?safety(step.safety):''}${buttons('ביצענו את השלב')}`;}
else if(step.kind==='note'){let old=p.notes[step.key]||'';html+=`<p class="prompt">${escapeHtml(step.prompt)}</p><label class="label" for="observation-field">המסקנה של הצוות</label><textarea id="observation-field" class="text-field" maxlength="420" data-field="${step.key}" placeholder="${escapeHtml(step.placeholder||'מה גיליתם בניסוי?')}">${escapeHtml(old)}</textarea><p class="small-muted">אין תשובה אחת שחייבים לכתוב. די במשפט או שניים שמתארים את התצפית שלכם.</p><div class="surface soft" style="margin-top:16px"><strong>הסבר מדעי – ייפתח אחרי שתכתבו מסקנה:</strong> ${old.trim()?escapeHtml(step.science):'<span class="muted">נסחו קודם את המסקנה שלכם כדי לראות את ההסבר.</span>'}</div>${buttons('עוברים לאתגר המדענים',true,!old.trim())}`;}
else if(step.kind==='timer'){html+=renderTimer(step,n);}
else if(step.kind==='results'){html+=`<p class="prompt">${escapeHtml(step.desc)}</p>${resultsMarkup()}<p class="small-muted">המערכת מציגה את הממוצעים שנמדדו אצלכם. תוצאות אחרות עשויות להיות שונות – זה חלק מהחקר.</p>${buttons('לניסוח המסקנה')}`;}
html+='</div><div class="small-actions" style="max-width:890px;margin:14px auto"><button class="btn btn-text" data-action="speak">◖ השמיעו הוראה</button><button class="btn btn-text" data-action="open-video" data-video="opening">▷ סרטון הפתיחה</button></div>';show(html);if(step.kind==='timer')drawTimer();}
function renderTimer(step,n){const times=S(n).measure[step.surface]||[];let ready=times.length>=2;return `<p class="prompt">${escapeHtml(step.desc)}</p><div class="small-actions">${badge(`${times.length}/2 מדידות הושלמו`,ready?'done':'')}</div><div class="stopwatch"><div class="small-muted" style="color:#c6dbea">שעון עצר דיגיטלי · ניסיון ${Math.min(times.length+1,2)}</div><div class="big-number" id="timer-display" aria-live="off">00:00.00</div><div class="timer-controls"><button class="btn btn-gold" data-action="timer-start" ${ready?'disabled':''} id="timer-start">התחל</button><button class="btn btn-ghost" data-action="timer-stop" disabled id="timer-stop">עצור</button><button class="btn btn-ghost" data-action="timer-save" disabled id="timer-save">שמור תוצאה</button></div><div class="mini-muted" style="color:#b8cddd;margin-top:12px">לחצו ״התחל״ כשמסובבים, ״עצור״ כשנעצר הסביבון, ואז ״שמור תוצאה״.</div></div><h3>המדידות שלכם</h3><div class="timeline">${times.length?times.map((v,i)=>`<span class="time-sample">ניסיון ${i+1}: ${fmtSeconds(v)} שנ׳</span>`).join(''):'<span class="empty-note">עדיין אין תוצאות. התחילו את הניסוי.</span>'}</div>${times.length?`<button class="btn btn-text" data-action="timer-redo">מודדים שוב את הניסיון האחרון</button>`:''}${ready?`<div class="feedback positive"><strong>יופי.</strong> שמרתם שתי מדידות. תוכלו להמשיך למשטח הבא.</div>`:''}${buttons('למשטח הבא',true,!ready)}`;}
function resultsMarkup(){const m=S(3).measure;let names={smooth:'קאפה חלקה',rough:'נייר לטש',fabric:'בד'};let data=Object.entries(names).map(([key,name])=>({key,name,values:m[key]||[],avg:(m[key]?.length===2)?(m[key][0]+m[key][1])/2:0}));let max=Math.max(...data.map(d=>d.avg),1);return `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>משטח</th><th>ניסיון 1</th><th>ניסיון 2</th><th>ממוצע</th></tr></thead><tbody>${data.map(x=>`<tr><td>${x.name}</td><td>${x.values[0]==null?'—':fmtSeconds(x.values[0])}</td><td>${x.values[1]==null?'—':fmtSeconds(x.values[1])}</td><td><strong>${fmtSeconds(x.avg)}</strong> שנ׳</td></tr>`).join('')}</tbody></table></div><h3>השוואת ממוצעי זמן הסיבוב</h3>${data.map(x=>`<div class="chart-row"><span>${x.name}</span><div class="chart-track"><span style="width:${100*x.avg/max}%"></span></div><b dir="ltr">${fmtSeconds(x.avg)}</b></div>`).join('')}<p class="small-muted">ממוצע = סכום שתי המדידות ÷ 2. לא נדרשת תוצאה ״צפויה״ מראש.</p>`;}
function toQuiz(){const n=state.station,p=S(n);if(!p.completedExperiment){p.completedExperiment=true;save()}let q=(quizFeedback?.ok&&quizFeedback.qId)?QA[n].required.find(x=>x.id===quizFeedback.qId):QA[n].required.find(x=>!p.required[x.id]);if(!q){state.screen='bonus';bonusView='intro';save();return render()};let done=QA[n].required.length-QA[n].required.filter(x=>!p.required[x.id]).length;show(`<div class="kicker">תחנה ${n} · אתגר המדענים</div><div class="station-head"><div><h1>אתגר המדענים</h1><p class="muted">שתי שאלות חובה. אפשר לנסות שוב ולקבל רמז בלי לאבד נקודות.</p></div>${badge(`${done}/2 שאלות חובה`,done===2?'done':'')}</div><div class="card step-card"><div class="eyebrow">${escapeHtml(TITLES[n].sub)}</div><div class="quiz-points">שאלת חובה · ${q.points} נקודות · ${escapeHtml(q.level)}</div><h2 class="quiz-title">${escapeHtml(q.q)}</h2>${quizOptions(q)}${quizFeedback?`<div class="feedback ${quizFeedback.ok?'positive':'hint'}">${quizFeedback.ok?'✓ ':'ⓘ '}${escapeHtml(quizFeedback.message)}</div>`:''}<div class="btn-row">${quizFeedback?.ok?`<button class="btn btn-primary" data-action="quiz-next">${done===1?'ממשיכים לשאלת החובה השנייה':'ממשיכים'} ←</button>`:`<button class="btn btn-primary" data-action="quiz-answer" ${choiceIndex===null?'disabled':''}>בודקים תשובה</button>`}<button class="btn btn-ghost" data-action="map">מפת התחנות</button></div></div><div class="surface" style="max-width:890px;margin:15px auto"><strong>הערה לחוקרים:</strong> נקודות ניתנות רק עבור תשובה נכונה, וההתקדמות נשמרת. אפשר לנסות כמה פעמים שצריך.</div>`);}
function quizOptions(q){return `<div class="choice-grid">${q.options.map((opt,i)=>`<button type="button" class="choice quiz-option ${choiceIndex===i?'selected':''}" data-action="select-answer" data-index="${i}" ${quizFeedback?.ok?'disabled':''}><span class="choice-letter quiz-choice-letter">${'אבגד'[i]}</span><span>${escapeHtml(opt)}</span></button>`).join('')}</div>`;}
function bonusIntro(){const n=state.station,variant=n===2||n===3,sc=questionPoints(n);return `<div class="kicker">נרות ${TITLES[n].lights} דולקים · תחנה ${n}</div><div class="station-head"><div><h1>אתגר המומחים</h1><p class="lead-muted">כל הכבוד! שאלות החובה הושלמו. הבונוס הוא רשות – אפשר להמשיך גם בלעדיו.</p></div>${badge(`${sc}/25 נקודות`,'done')}</div><div class="card step-card"><div class="completion"><h2>שני האורות של התחנה כבר דולקים</h2><p>הצלחתם להתמודד עם הניסוי ושאלות החובה. רוצים להמשיך להעמיק?</p></div>${variant?`<div class="two-col" style="margin-top:20px"><div><div class="quiz-points">עד 3 נקודות · בלי צפייה</div><h3 style="margin-top:12px">פותרים מהידע שלכם</h3><p class="muted">שתי שאלות ראשונות פתוחות לכולם. אם תחליטו לצפות בהמשך, תוכלו לפתוח שאלת מומחים נוספת.</p></div><div class="unlock"><strong>עד 5 נקודות · אחרי הסרטון</strong><p>סרטון הסיכום מלמד מידע נוסף. השלמת צפייה או תקציר נגיש פותחת שאלה נוספת בשווי 2 נקודות – אבל צריך לפתור אותה נכון.</p></div></div>${mediaButton(n===2?'ledSummary':'spinSummary','סרטון סיכום והעמקה')}`:`<h3 style="margin-top:22px">שאלת בונוס מאתגרת · 5 נקודות</h3><p>נסו להתמודד עם שאלה שמצריכה הסקה ויישום של מה שגיליתם.</p>${n===1?mediaButton('oilSummary','אפשר לצפות גם בסרטון סיכום הניסוי'):''}`}<div class="btn-row">${bonusEarned(n)<5?`<button class="btn btn-primary" data-action="bonus-begin">${bonusEarned(n)?'חוזרים לשאלות הבונוס ←':'מנסים שאלות בונוס ←'}</button>`:`<span class="pill done">כל 5 נקודות הבונוס כבר נצברו!</span>`}<button class="btn btn-ghost" data-action="bonus-skip">מדלגים וממשיכים</button><button class="btn btn-text" data-action="revisit">חוזרים לחקר</button>${allRequired()?`<button class="btn btn-text" data-action="finish">סיכום המשימה</button>`:''}</div></div>`;}
function bonusQuestions(){const n=state.station,p=S(n),qs=QA[n].bonus;let i=(quizFeedback?.ok&&quizFeedback.qId)?qs.findIndex(q=>q.id===quizFeedback.qId):qs.findIndex(q=>!p.bonuses[q.id]);if(i<0)return bonusCompleted();p.bonusIndex=i;const q=qs[i];if(q.locked&&!p.watched){return show(`<div class="kicker">תחנה ${n} · שלב ההעמקה</div><h1>שאלת מומחים נוספת ממתינה לכם</h1><div class="card step-card"><div class="unlock"><h2>עוד 2 נקודות אפשריות</h2><p>השלמת סרטון הסיכום או תקציר נגיש תפתח את שאלת המומחים השלישית. צפייה אינה מעניקה ניקוד בפני עצמה; התשובה הנכונה כן.</p></div>${mediaButton(n===2?'ledSummary':'spinSummary','צופים בסרטון ההעמקה')}<div class="btn-row"><button class="btn btn-ghost" data-action="bonus-skip">מדלגים וממשיכים</button></div></div>`)}

function bonusCompleted(){const n=state.station,earned=QA[n].bonus.reduce((a,q)=>a+(S(n).bonuses[q.id]?q.points:0),0);show(`<div class="kicker">תחנה ${n} · סיכום הבונוס</div><div class="card step-card"><div class="completion"><h1>תחנה ${n} הושלמה!</h1><div class="points-display">${questionPoints(n)} / 25</div><p>צברתם ${earned} נקודות בונוס, והנרות ${TITLES[n].lights} דולקים.</p></div><div class="btn-row"><button class="btn btn-primary" data-action="map">למפת התחנות ←</button>${allRequired()?`<button class="btn btn-ghost" data-action="finish">לסיכום המשימה</button>`:''}</div></div>`);}

function toVideo(){let v=state.video;if(!v||!MEDIA[v.key])return toMap();let key=v.key,summary=key==='ledSummary'||key==='spinSummary',n=key==='ledSummary'?2:key==='spinSummary'?3:state.station,watched=summary&&S(n).watched;show(`<div class="kicker">מרכז המדיה · טכנודע</div><h1>${escapeHtml(videoName(key))}</h1><p class="lead-muted">${summary?'הסרטון מציג ידע מדעי נוסף שעשוי לעזור לכם להתמודד עם שאלות הבונוס.':'הסרטון זמין לצפייה חוזרת לפי בחירה; ההתקדמות במשחק נשמרת.'}</p><div class="card"><div class="video-shell"><video id="activity-video" controls playsinline preload="metadata" src="${MEDIA[key]}" aria-label="${escapeHtml(videoName(key))}"></video></div><div class="video-options"><button class="btn btn-primary" data-action="video-back">חזרה למשחק ←</button><button class="btn btn-ghost" data-action="video-replay">לצפייה חוזרת</button><a class="btn btn-text" href="${MEDIA[key]}" target="_blank" rel="noopener noreferrer">פתחו את הסרטון בחלון נפרד</a></div>${summary?`<div class="surface"><strong>${watched?'✓ השלמתם את ההעמקה':'העמקה לקראת שאלת המומחים'}</strong><p>${watched?'שאלת המומחים הנוספת נפתחה עבור הצוות שלכם.':'השלימו צפייה בסרטון כדי לפתוח את שאלת המומחים הנוספת (2 נקודות). עצם הצפייה אינה מקנה ניקוד.'}</p><button class="btn btn-ghost" data-action="video-alt">${watched?'לקריאת ההסבר המדעי':'חלופה נגישה: קריאה או האזנה להסבר המדעי'}</button></div>`:''}<p class="small-muted" style="margin-top:13px">הסרטון מתארח ב־Cloudinary ודורש חיבור לאינטרנט. אם הסרטון אינו פועל, ניתן להשתמש בקישור לפתיחה נפרדת${summary?' או בתקציר הנגיש':''}.</p></div>`);let el=document.getElementById('activity-video');if(el){let prev=Number(state.videoTimes?.[key]||0);el.addEventListener('loadedmetadata',()=>{if(prev>1&&prev<el.duration-2){try{el.currentTime=prev;}catch(e){}}});let lastSavedSecond=-1;el.addEventListener('timeupdate',()=>{const second=Math.floor(el.currentTime);if(second!==lastSavedSecond&&second%2===0){lastSavedSecond=second;state.videoTimes[key]=el.currentTime;save();}});el.addEventListener('ended',()=>{state.videoTimes[key]=0;if(summary){S(n).watched=true;save();toast('סיימתם לצפות! שאלת המומחים הנוספת נפתחה.');let box=document.querySelector('.surface strong');if(box)box.textContent='✓ השלמתם את ההעמקה';}else save();});}}
function toAccessible(){let n=state.station;if(n!==2&&n!==3)return toVideo();show(`<div class="kicker">חלופה נגישה לסרטון</div><h1>${escapeHtml(SUMMARY[n].title)}</h1><div class="card step-card"><p class="lead-muted">${escapeHtml(SUMMARY[n].text)}</p><p class="small-muted">המידע כאן שקול לנושאי סרטון ההעמקה. אפשר להאזין לו באמצעות כפתור ההקראה.</p><div class="btn-row"><button class="btn btn-ghost" data-action="speak-alt">האזינו להסבר</button><button class="btn btn-primary" data-action="alt-finished">קראנו והבנו · לשאלת המומחים</button><button class="btn btn-text" data-action="video-back">חזרה למשחק</button></div></div>`);}
function finishView(){if(!allRequired()){state.screen='map';return toMap()}let score=totalScore(),max=100,bonus=score-80;show(`<div class="kicker">מבצע שמונת האורות · סיכום</div><section class="home-hero"><div><h1>המשימה הושלמה!</h1><p class="lead-muted">${escapeHtml(state.team||'צוות החוקרים')}, חקרתם, מדדתם, בדקתם והסקתם מסקנות. כל שמונת האורות דולקים.</p><div class="result-summary"><div style="color:#163f5b"><span class="result-number">${score}</span><br>מתוך 100</div><div style="color:#163f5b"><span class="result-number">80</span><br>נקודות חובה</div><div style="color:#163f5b"><span class="result-number">${bonus}</span><br>נקודות בונוס</div></div><div class="btn-row"><button class="btn btn-gold" data-action="map">חוזרים למפת התחנות</button><button class="btn btn-ghost" data-action="print">הדפסת סיכום</button></div></div><div class="hero-side"><div class="light-panel">${lightsMarkup()}<div class="hero-caption">כל האורות דולקים · המשימה הושלמה</div></div></div></section><div class="section-heading"><h2>סיכום התחנות</h2><span class="small-muted">אפשר לחזור ולנסות להוסיף נקודות בונוס</span></div><div class="station-grid">${[1,2,3,4].map(n=>`<button class="station-card" data-action="start-station" data-station="${n}"><span class="station-index">${n.toString().padStart(2,'0')}</span><span class="station-copy"><strong>${escapeHtml(TITLES[n].name)}</strong><span class="pill done">${questionPoints(n)} / 25 נקודות</span></span></button>`).join('')}</div>${bonusReturnPanel()}<div class="card" style="margin-top:20px"><h2>ארבע תגליות מהמשימה</h2><ol class="step-list"><li><strong>שמן ומים:</strong> סבון מסייע לפזר שמן בטיפות בתוך מים.</li><li><strong>LED:</strong> נורה זקוקה למעגל סגור ולקוטביות נכונה.</li><li><strong>סביבון:</strong> חיכוך, יציבות ואופן הסיבוב משפיעים על משך התנועה.</li><li><strong>אור וצל:</strong> שינוי מרחק וצורת דמות משפיעים על הצללית.</li></ol><div class="surface"><strong>מה הפתיע אתכם?</strong><label class="label" for="reflection">כתבו משפט קצר שלמדתם מהניסוי</label><textarea id="reflection" data-field="reflection" class="text-field" placeholder="גילינו ש...">${escapeHtml(state.reflection||'')}</textarea></div><div class="small-actions"><button class="btn btn-text" data-action="reset-prompt">מתחילים משחק חדש במכשיר הזה</button></div></div>`);}
function render(){header();switch(state.screen){case 'welcome':return toWelcome();case 'map':return toMap();case 'station':return renderStation();case 'quiz':return toQuiz();case 'bonus':return toBonus();case 'video':return toVideo();case 'accessible':return toAccessible();case 'finish':return finishView();default:state.screen='welcome';return toWelcome();}}
function openVideo(key){if(!MEDIA[key])return;stopSpeech();if(timer.running){resetWatch();toast('מדידה פעילה אופסה לפני פתיחת הסרטון.');}let source=state.screen;let previousVideo=state.video;state.video={key,returnScreen:source,returnVideo:previousVideo};state.screen='video';save();render();}
function videoBack(){let old=state.video;if(!old){state.screen='map';return render()};state.screen=old.returnScreen==='video'?'map':old.returnScreen||'map';state.video=null;save();render();}
function stopSpeech(){if('speechSynthesis' in window){try{speechSynthesis.cancel()}catch(e){}}}
function speakCurrent(text){if(!('speechSynthesis' in window))return toast('במכשיר הזה אין מנגנון הקראה זמין.');stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='he-IL';u.rate=.94;speechSynthesis.speak(u);}
function stopWatch(){if(timer.animation)cancelAnimationFrame(timer.animation);timer.animation=null;timer.running=false;}
function resetWatch(){stopWatch();timer.elapsed=0;drawTimer();}
function drawTimer(){const el=document.getElementById('timer-display');if(!el)return;const val=timer.running?(performance.now()-timer.started)/1000:timer.elapsed;let minutes=Math.floor(val/60),seconds=(val%60).toFixed(2).padStart(5,'0');el.textContent=`${String(minutes).padStart(2,'0')}:${seconds}`;const st=document.getElementById('timer-start'),sp=document.getElementById('timer-stop'),sv=document.getElementById('timer-save');if(st)st.disabled=timer.running||S(3).measure[STEPS[3][S(3).step]?.surface]?.length>=2;if(sp)sp.disabled=!timer.running;if(sv)sv.disabled=timer.running||timer.elapsed<=0;}
function timerTick(){if(!timer.running)return;drawTimer();timer.animation=requestAnimationFrame(timerTick);}
function startWatch(){let step=STEPS[3][S(3).step];if(state.screen!=='station'||step.kind!=='timer')return;timer.elapsed=0;timer.started=performance.now();timer.running=true;timerTick();}
function endWatch(){if(!timer.running)return;timer.elapsed=Math.max(0,(performance.now()-timer.started)/1000);stopWatch();drawTimer();}
function saveWatch(){let step=STEPS[3][S(3).step];if(step?.kind!=='timer'||timer.running||timer.elapsed<.2)return toast('התחילו ועצרו את השעון כדי לשמור מדידה.');let vals=S(3).measure[step.surface];if(vals.length>=2)return;vals.push(Number(timer.elapsed.toFixed(2)));save();resetWatch();render();toast('המדידה נשמרה בטבלה.');}
function testQ(mode){let n=state.station,p=S(n),questions=mode==='required'?QA[n].required:QA[n].bonus;let q=questions.find(x=>!(mode==='required'?p.required:p.bonuses)[x.id]);if(!q)return;let answer=choiceIndex;if(answer===null)return;let correct=answer===q.correct;if(correct){(mode==='required'?p.required:p.bonuses)[q.id]=true;save();quizFeedback={ok:true,qId:q.id,message:q.good};}else{quizFeedback={ok:false,qId:q.id,message:'נסו שוב. רמז: '+q.hint};choiceIndex=null;}render();}
function stepNext(){let n=state.station,p=S(n),step=STEPS[n][p.step];if(step.kind==='choice'&&p.notes[step.key]===undefined)return toast('בחרו תשובה כדי לתעד את ההשערה או התצפית.');if(step.kind==='note'&&!String(p.notes[step.key]||'').trim())return toast('כתבו משפט קצר על מה שגיליתם.');if(step.kind==='timer'&&p.measure[step.surface].length<2)return toast('צריך לשמור שתי מדידות לפני שממשיכים.');stopWatch();timer.elapsed=0;p.step++;if(p.step>=STEPS[n].length){p.completedExperiment=true;state.screen='quiz';choiceIndex=null;quizFeedback=null;}save();render();}
function stepPrev(){let p=S();if(p.step>0){stopWatch();timer.elapsed=0;p.step--;save();render();}else {state.screen='map';save();render();}}
function startStation(n){if(!(n>=1&&n<=4))return;stopWatch();timer.elapsed=0;state.station=n;choiceIndex=null;quizFeedback=null;const p=S(n);if(requiredDone(n)){state.screen='bonus';bonusView='intro';}else if(p.completedExperiment){state.screen='quiz'}else state.screen='station';save();render();}
function finishStation(){state.screen='map';bonusView='intro';choiceIndex=null;quizFeedback=null;save();render();if(allRequired())toast('כל שמונת האורות דולקים! תוכלו לעבור לסיכום המשימה.');}
function delegatedClick(e){const button=e.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;const n=state.station;switch(action){
case 'begin-new':{
  const input=document.getElementById('team-input');

  if(hasPriorProgress()&&!window.confirm('נמצא משחק קודם במכשיר הזה. התחלת משימה חדשה תאפס את הנרות, הניקוד והתשובות הישנות. להתחיל מחדש?'))break;
  stopWatch();timer.elapsed=0;stopSpeech();
  state=defaultState();state.team=newTeam;state.screen='map';
  bonusView='intro';choiceIndex=null;quizFeedback=null;simReversed=false;

}
case 'resume':{

}
case 'map':{stopWatch();timer.elapsed=0;stopSpeech();state.screen='map';save();render();break;}

case 'return-bonus':startStation(Number(button.dataset.station));break;
case 'next':stepNext();break;
case 'prev':stepPrev();break;
case 'choice':{let step=STEPS[n][S(n).step];S(n).notes[step.key]=Number(button.dataset.index);save();render();break;}

case 'video-replay':{const v=document.getElementById('activity-video');if(v){v.currentTime=0;v.play().catch(()=>{});}break;}

case 'select-answer':{if(quizFeedback?.ok)break;choiceIndex=Number(button.dataset.index);quizFeedback=null;render();break;}
case 'quiz-answer':testQ('required');break;
case 'quiz-next':{quizFeedback=null;choiceIndex=null;if(requiredDone(n)){state.screen='bonus';bonusView='intro';save();}render();break;}
case 'bonus-begin':bonusView='questions';quizFeedback=null;choiceIndex=null;render();break;
case 'bonus-answer':testQ('bonus');break;
case 'bonus-next':quizFeedback=null;choiceIndex=null;render();break;
case 'bonus-skip':finishStation();break;

case 'print':window.print();break;
case 'reset-prompt':if(window.confirm('למחוק את ההתקדמות והניקוד במכשיר הזה ולהתחיל מחדש?')){state=defaultState();localStorage.removeItem(STORAGE_KEY);bonusView='intro';render();}break;
}}
function delegatedInput(e){const el=e.target;if(el.matches('[data-field]')){if(el.dataset.field==='reflection'){state.reflection=el.value;save();}else{S().notes[el.dataset.field]=el.value;save();if(state.screen==='station'&&STEPS[state.station][S().step]?.kind==='note'){const next=document.querySelector('[data-action="next"]');if(next)next.disabled=!el.value.trim();const info=el.closest('.card')?.querySelector('.surface.soft');if(info){let step=STEPS[state.station][S().step];info.innerHTML=`<strong>הסבר מדעי:</strong> ${escapeHtml(el.value.trim()?step.science:'נסחו קודם את המסקנה כדי לראות את ההסבר.')}`;}}}}}
function delegatedChange(e){if(e.target.id==='team-input'){state.team=e.target.value.trim().slice(0,26);save()}}
function onHide(){if(timer.running){endWatch();resetWatch();toast('המדידה נעצרה כי יצאתם מהמסך. התחילו אותה מחדש.');}}
function init(){document.body.addEventListener('click',delegatedClick);document.body.addEventListener('input',delegatedInput);document.body.addEventListener('change',delegatedChange);document.getElementById('brand-home').addEventListener('click',e=>{e.preventDefault();state.screen=state.team?'map':'welcome';save();render();});document.addEventListener('visibilitychange',()=>{if(document.hidden)onHide()});window.addEventListener('pagehide',onHide);render();}
init();

</script>
</body>
</html>
